name: Deploy NestJS Backend to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install ALL dependencies (CI machine, not EC2)
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build NestJS app
      - name: Build NestJS
        run: npm run build

      # 5️⃣ Remove dev dependencies (production ready)
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      # 6️⃣ Sanity check (prevents empty archive issues)
      - name: Verify build output
        run: |
          echo "PWD:"
          pwd
          echo "Root files:"
          ls -la
          echo "Dist contents:"
          ls -la dist

      # 7️⃣ Copy READY artifacts to EC2
      - name: Copy backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist,node_modules,package.json,package-lock.json
          target: /home/ubuntu/backend

      # 8️⃣ Reload PM2 (zero downtime)
      - name: Reload PM2 on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/backend
            /home/ubuntu/.nvm/versions/node/v24.11.1/bin/pm2 reload backend
